[package]
name = "mcphub"
version = "1.0.40001"
description = "MCPHub Desktop - A unified hub for MCP servers"
authors = ["MCPHub Contributors"]
license = "ISC"
repository = "https://github.com/samanhappy/mcphub"
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "mcphub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mcphub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-ico",
  "image-png",
  "devtools",
] }
# tauri-plugin-shell intentionally absent: its injected init script opens
# target=_blank links via pre_exec/double-fork, which crashes in
# _malloc_fork_child with mimalloc's malloc-zone override on macOS 26.
# External links use the `open_external_url` command (posix_spawn) instead.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (SSE + Streamable HTTP MCP transports)
reqwest = { version = "0.13", features = [
  "json",
  "stream",
  "rustls-native-certs",
  "query",
] }

# SQLite database
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
  "uuid",
  "chrono",
] }

# Git data source (RAG): pure-Rust gitoxide, compiled into the binary (no
# external git needed). blocking-network-client = synchronous network client
# (used inside spawn_blocking); worktree-mutation = checkout support.
gix = { version = "0.73", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation"] }
# HTTP(S) basic-auth over plain http:// (self-hosted GitLab/Gitea on intranets):
# gix-transport refuses credentials on http by default; this feature flag lifts
# that guard. Same 0.48 as gix uses -> feature unification applies.
gix-transport = { version = "0.48", features = ["http-client-insecure-credentials"] }

# Authentication
# jsonwebtoken 11 requires exactly one CryptoProvider feature (or a manual
# install_default()). We enable `rust_crypto` (pure-Rust, no C toolchain) so
# HS256 sign/verify works out of the box across all desktop targets; otherwise
# issue_token/encode panics with "Could not automatically determine the
# process-level CryptoProvider".
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
bcrypt = "0.19"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# MD5 hashing for RAG import-method update detection (symlink/copy content
# fingerprint stored in DocMeta.md5). Lightweight; matches the "md5" naming in
# the feature spec.
md-5 = "0.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# OS keychain (secure credential storage)

# HTTP server (expose MCP endpoints when expose_http = true)
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["cors"] }

# Async trait
async-trait = "0.1"

# URL parsing
url = "2"

# Base64
base64 = "0.23"

# Random generation
rand = "0.10"

# Futures utilities
futures-util = "0.3"

# tokio sync primitives (used in MCP connection pool)
tokio-stream = "0.1"

# Archive extraction for bundled runtime installation
flate2 = "1"
tar = "0.4"
rmcp-openapi = "0.31"

# RAG binary office-document import (rag/extract/): pure-Rust extractors,
# both output Markdown directly.
pdf_oxide = "0.3"      # PDF -> markdown (default features: icc + legacy-crypto)
office_oxide = "0.1"   # docx/doc/xlsx/xls/pptx/ppt -> markdown (default features: none)
# Image decoding for the OCR pipeline (validate uploads, re-encode to PNG for
# tesseract on Linux). Feature set matches the formats the image OCR strategy
# accepts; merges with pdf_oxide's image subset into one compilation.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
# ZIP container reading (OOXML office files). Promoted from the Windows target
# section to all platforms with default features off: only the pure-Rust
# deflate backend (matches office_oxide/pdf_oxide internal declarations for a
# single compilation; avoids zstd-sys/bzip2/lzma C deps from default features).
zip = { version = "8", default-features = false, features = ["deflate"] }

# SQLite FTS5 全文检索分词链（2026-09-05）：
# charabia（Meilisearch 分词器，default = 全语言：中文/日/韩/泰/希伯来/希腊等）+
# latin camelCase/snake_case 拆分 + pinyin（汉字→全拼/首字母，生成拼音索引列）。
# 严禁启用 charabia 的 `chinese-normalization-pinyin`（会把中文 lemma 归一成拼音，
# 破坏 zh 列"存原文词元"的语义）。
charabia = { version = "0.10", features = ["latin-camelcase", "latin-snakecase"] }
pinyin = { version = "0.10", features = ["plain"] }

# RAG: embedding inference (tokenizers + candle) + vector DB (lancedb).
# `default-features = false` avoids the esaxx C++ dependency (the macOS CLT
# C++ headers are incomplete); BPE tokenization only needs fancy-regex.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex", "progressbar"] }
lancedb = "0.37"
# RAG GGUF backend: candle (pure-Rust tensor lib by HF). Used by `GgufEmbedder`
# for GGUF embedding models (candle's quantized QMatMul has native int4 kernels
# on CPU/Metal). GPU is engaged per-target (metal on macOS, cuda on Linux
# NVIDIA); Windows is CPU-only (candle has no DirectML EP). Version pinned
# per-target below to union features.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# AHashMap (ahash) - used by `tokenizers`'s BPE `Vocab`; needed to build a BPE
# tokenizer from GGUF metadata (when no tokenizer.json ships alongside).
ahash = "0.8"
# Encoding detection + SIMD-accelerated conversion for non-UTF-8 text uploads.
encoding_rs = "0.8"
chardetng = "1.0"
# RAG chunking: semantic text/markdown/code splitting. `default-features=false`
# keeps the `tokenizers` feature OFF — it would pull tokenizers' `onig`
# (Oniguruma C dep) which this project deliberately avoids (see the `tokenizers`
# pin above). We supply our own `ChunkSizer` (counts tokens via the loaded
# `Embedder::tokenize_offsets`) in `rag/chunker.rs`. `code` pulls tree-sitter
# 0.26 (AST-aware code splitting); `markdown` pulls pulldown-cmark (pure Rust).
text-splitter = { version = "0.32", default-features = false, features = ["code", "markdown"] }
tree-sitter = "0.26"
# tree-sitter grammars for CodeSplitter (one per supported source language).
# Each is a small C grammar compiled via its own `cc` build script (same build
# model as the existing candle C deps). Add a grammar + an extension
# entry in `chunker::code_language` to support a new language.
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# Global allocator experiment: with `override` it replaces the system malloc
# (incl. for candle's C deps) and returns freed pages to the OS more
# aggressively. Helps verify if RAG disable can drop RSS. Revert by removing
# this + the #[global_allocator] in main.rs.
mimalloc = { version = "0.1", features = ["override"] }
# Direct dep so `rag::service::stop` can call `libmimalloc_sys::mi_collect`
# (the `extended`-feature binding) to return freed pages to the OS on RAG
# disable. Referencing this crate from the lib forces its static archive into
# the cdylib link — otherwise mimalloc is only pulled via the bin's
# #[global_allocator] (main.rs), leaving `mi_collect` unresolved in the
# cdylib. `override` on `mimalloc` (above) enables the `#[used] mi_malloc`
# that drags in mimalloc's single-object static.c (which also defines
# mi_collect).
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
# Windows OCR engine (Windows.Media.Ocr, built into the OS) for the RAG
# image/PDF/Office OCR pipeline. Feature set unlocks the WinRT types used by
# rag/extract/ocr.rs (engine + bitmap decode + stream plumbing).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    # ShellExecuteExW + SHELLEXECUTEINFOW are gated behind this feature in the
    # windows 0.62 bindings (used by skill_service::create_symlinks_elevated
    # for the UAC-elevated launch path).
    "Win32_System_Registry",
    # TokenElevation / GetTokenInformation / TOKEN_ELEVATION for the startup
    # elevation check in lib::win_deelevate (relaunch non-elevated when the
    # NSIS installer auto-launches the app elevated after a per-machine install).
    "Win32_Security",
    # CoInitializeEx / CoUninitialize apartment init for the WinRT OCR
    # pipeline (rag/extract/ocr.rs recognize()).
    "Win32_System_Com",
    # WinRT OCR pipeline (rag/extract/ocr.rs).
    "Foundation",
    "Globalization",
    "Graphics",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
# Windows RAG embedding is CPU-only (candle has no DirectML EP).

# macOS: set process display name in Dock during dev
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# Apple Vision OCR bindings for the RAG image/PDF/Office OCR pipeline
# (rag/extract/ocr.rs). Pure objc2 header bindings — links the system Vision
# framework, no extra build toolchain (deliberately NOT a cidre-based crate:
# cidre's build script requires a full Xcode install, unavailable with
# CommandLineTools alone).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
# candle Metal (GPU) + accelerate (Apple BLAS sgemm) on macOS. The `accelerate`
# feature makes candle's CPU f32 matmul route through Apple Accelerate (vDSP/
# AMX) instead of the pure-Rust `gemm` crate - ~2-5x faster for the CPU path
# (F2LLMv2-style models that set deploy.json "platform":"CPU"). GPU (Metal)
# still uses the int4 Metal kernels; accelerate only engages on the CPU device.
candle-core = { version = "0.11", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11", features = ["metal"] }

# Linux: CPU-only by design. No `cuda` and no `mkl` features:
#
# - `cuda`: pulls cudarc with `cuda-version-from-build-system` (build.rs panics
#   if `nvcc` is missing) AND `dynamic-linking` (bakes a hard `DT_NEEDED` on
#   libcudart/libcublas). Won't compile on a CUDA-less CI runner, and the
#   binary won't start on any Linux box without the NVIDIA CUDA runtime.
# - `mkl`: candle routes F16 matmul to MKL's `hgemm_`, but the
#   intel-mkl-src static package (`rust-math/rust-mkl` via ocipkg, 2020.1)
#   only ships `sgemm_`/`dgemm_` — `hgemm_` is undefined → link failure. Since
#   the F16 matmul path is compiled whenever `mkl` is on, there's no way to
#   keep MKL for f32/f64 without forking candle. So drop it entirely.
#
# Both Linux arches fall back to the pure-Rust `gemm` crate (rayon
# multi-threaded; handles f16). Same path the Windows build uses. A candle
# fork (cuda→dynamic-loading) would re-enable GPU; not worth maintaining here.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Reduce debug-symbol volume so the dev binary is smaller and links faster
# (the dev build was ~70GB with full `debug=2` symbols; linking dominated
# wall time even for one-line changes). `debug=1` keeps line-number info
# (usable backtraces, breakpoints) without per-variable symbols.
debug = 1
# macOS: split debug info into a sibling .dSYM instead of embedding in the
# binary - the binary itself is small so relinking on each `tauri dev` is fast.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Build dependencies at opt-level=1 (vs the default 0): the single recompile
# is slightly slower but the resulting code runs faster + smaller, and the
# cached artifacts link faster. opt-level=0 for deps produced huge unoptimized
# blobs that slowed the final link.
opt-level = 1
debug = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# ⚠️ 使用 "debuginfo" 而非 true（即 "symbols"）
# strip = true 会移除 __TAURI_BUNDLE_TYPE 符号，导致 Tauri CLI 无法注入 bundle 类型信息
# 这会导致 updater 无法识别 bundle 类型，自动更新功能失效
strip = "debuginfo"
